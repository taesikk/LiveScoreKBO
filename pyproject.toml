[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kbo-alert"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "slack_sdk>=3.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "anthropic>=0.69.0",
]

[tool.setuptools]
packages = ["kbo_alert", "kbo_alert.slack", "kbo_alert.crawler", "kbo_alert.notifier", "news_briefing"]
